<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#05080d"/>
      <stop offset="40%" stop-color="#0a1520"/>
      <stop offset="100%" stop-color="#0d1f2d"/>
    </linearGradient>

    <!-- Teal brand glow -->
    <radialGradient id="tealGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#2ecec2" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#1a8a82" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d1f2d" stop-opacity="0"/>
    </radialGradient>

    <!-- Sun -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="1"/>
      <stop offset="50%" stop-color="#e8a830" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d4872a" stop-opacity="0.7"/>
    </radialGradient>

    <!-- Sun halo -->
    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#e8a830" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#e8a830" stop-opacity="0"/>
    </radialGradient>

    <!-- Mountain depth gradient -->
    <linearGradient id="mtn1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1e28"/>
      <stop offset="100%" stop-color="#071219"/>
    </linearGradient>
    <linearGradient id="mtn2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2a35"/>
      <stop offset="100%" stop-color="#091a22"/>
    </linearGradient>
    <linearGradient id="mtn3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132f3a"/>
      <stop offset="100%" stop-color="#0b1f28"/>
    </linearGradient>

    <!-- Mist -->
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ecec2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1a8a82" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d1f2d" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom fade -->
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05080d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05080d" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Top teal line glow -->
    <linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ecec2" stop-opacity="0"/>
      <stop offset="30%" stop-color="#2ecec2" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#2ecec2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2ecec2" stop-opacity="0"/>
    </linearGradient>

    <!-- Noise filter -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <!-- Text glow filter -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#2ecec2" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="500" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="80" cy="60" r="1" fill="white" opacity="0.5"/>
  <circle cx="150" cy="30" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="250" cy="80" r="1.2" fill="white" opacity="0.3"/>
  <circle cx="400" cy="45" r="0.7" fill="white" opacity="0.5"/>
  <circle cx="480" cy="90" r="1" fill="white" opacity="0.35"/>
  <circle cx="530" cy="55" r="0.9" fill="white" opacity="0.45"/>
  <circle cx="50" cy="120" r="0.6" fill="white" opacity="0.3"/>
  <circle cx="350" cy="25" r="1.1" fill="white" opacity="0.25"/>
  <circle cx="560" cy="130" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="200" cy="45" r="0.5" fill="white" opacity="0.35"/>
  <circle cx="440" cy="110" r="0.7" fill="white" opacity="0.3"/>
  <circle cx="120" cy="100" r="0.9" fill="white" opacity="0.2"/>

  <!-- Sun halo (large, soft) -->
  <circle cx="420" cy="175" r="120" fill="url(#sunHalo)"/>

  <!-- Sun -->
  <circle cx="420" cy="175" r="32" fill="url(#sunGrad)"/>
  <!-- Sun inner bright -->
  <circle cx="420" cy="175" r="18" fill="#fff5d4" opacity="0.3"/>

  <!-- Teal atmospheric glow -->
  <ellipse cx="300" cy="300" rx="350" ry="220" fill="url(#tealGlow)"/>

  <!-- Far mountains (background) -->
  <polygon points="0,500 0,300 60,265 140,310 200,245 280,290 340,220 420,280 480,200 540,260 600,210 600,500" fill="url(#mtn1)" opacity="0.5"/>

  <!-- Mid mountains -->
  <polygon points="0,500 0,330 50,290 120,340 190,270 260,320 330,250 400,310 450,240 520,300 580,250 600,270 600,500" fill="url(#mtn2)" opacity="0.7"/>

  <!-- Front mountains -->
  <polygon points="0,500 0,360 70,320 150,370 220,300 300,350 380,290 440,340 500,280 560,330 600,310 600,500" fill="url(#mtn3)" opacity="0.85"/>

  <!-- Forest/treeline silhouette -->
  <polygon points="0,500 0,380 20,370 35,378 50,365 65,375 80,360 95,372 110,358 130,370 145,355 160,368 175,352 190,365 205,350 220,363 240,348 255,360 270,345 290,358 305,342 320,356 340,340 355,354 370,338 385,350 400,335 420,348 435,332 450,345 470,330 485,342 500,328 515,340 530,325 545,338 560,322 575,335 590,320 600,330 600,500" fill="#06121a" opacity="0.9"/>

  <!-- Mist layers -->
  <rect x="0" y="340" width="600" height="80" fill="url(#mist)"/>
  <ellipse cx="300" cy="380" rx="400" ry="40" fill="#2ecec2" opacity="0.03"/>

  <!-- Bottom fade -->
  <rect x="0" y="380" width="600" height="120" fill="url(#bottomFade)"/>

  <!-- Teal accent line -->
  <rect x="0" y="496" width="600" height="2" fill="url(#lineGlow)"/>

  <!-- AVITAS brand text -->
  <g filter="url(#textGlow)">
    <text x="300" y="440" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="18" fill="#e8f5f3" opacity="0.9">AVITAS</text>
  </g>

  <!-- Subtle subtitle -->
  <text x="300" y="468" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="6" fill="#2ecec2" opacity="0.5">PREMIUM CANNABIS</text>

  <!-- Noise overlay for texture -->
  <rect width="600" height="500" filter="url(#noise)" opacity="0.03"/>

  <!-- Vignette -->
  <rect width="600" height="500" fill="url(#bg)" opacity="0.15" rx="0"/>
</svg>
